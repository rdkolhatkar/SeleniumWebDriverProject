# Serenity report output directory
serenity.outputDirectory = src/test/resources/SerenityReports

# Set report title and encoding
serenity.report.title = Serenity E-commerce Test Report
serenity.encoding = UTF-8

# Set browser and driver type
webdriver.driver = chrome
webdriver.autodownload = true

# Optional: logging and screenshot settings
serenity.take.screenshots = FOR_EACH_ACTION
serenity.verbose.steps = true
